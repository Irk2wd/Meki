name: Publish release

on:
  workflow_run:
    workflows: ['Desktop CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (defaults to the current Meki version)
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      plan: ${{ steps.release.outputs.plan }}
    steps:
      - name: Check out the pinned publishing tools and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful tagged builds for both editions
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INSTALLER_TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
          INSTALLER_RUN: ${{ github.event.workflow_run.id }}
        run: python3 scripts/prepare-release.py resolve "$INSTALLER_TAG" --run "$INSTALLER_RUN"

  publish:
    needs: resolve
    if: needs.resolve.outputs.version != ''
    concurrency:
      group: publish-release-${{ needs.resolve.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the pinned publishing tools and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Check source jobs and download exact tested installers and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PLAN: ${{ needs.resolve.outputs.plan }}
        run: python3 scripts/prepare-release.py stage "$RUNNER_TEMP/meki-delivery"
      - name: Verify each edition against its tagged source and installed platforms
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          for product in Meki mekiR; do
            edition="$RUNNER_TEMP/meki-delivery/$product"
            (
              cd "$edition/source"
              npm ci
              python3 scripts/deliver-installers.py "$edition/ci-artifacts" "$edition/publish" \
                --ci-json "$edition/installer-ci.json" --source-archive "$edition/source.zip"
            )
          done
      - name: Publish one release only after all files are uploaded and verified
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: python3 scripts/publish-release.py "$RELEASE_VERSION" "$RUNNER_TEMP/meki-delivery"
