name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Approved release tag (vX.Y.Z or mekir-vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      plan: ${{ steps.release.outputs.plan }}
    steps:
      - name: Check out the pinned publishing tools and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed editions and require their successful tagged builds
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/prepare-release.py resolve "$RELEASE_TAG"

  publish:
    needs: resolve
    if: needs.resolve.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the pinned publishing tools and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Stage tagged source and verified installer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PLAN: ${{ needs.resolve.outputs.plan }}
        run: python3 scripts/prepare-release.py stage "$RUNNER_TEMP/meki-delivery"
      - name: Verify each edition against its tagged source and installed platforms
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          for product in Meki mekiR; do
            edition="$RUNNER_TEMP/meki-delivery/$product"
            if [ ! -d "$edition" ]; then continue; fi
            (
              cd "$edition/source"
              npm ci
              python3 scripts/deliver-installers.py "$edition/ci-artifacts" "$edition/publish" \
                --ci-json "$edition/installer-ci.json" --source-archive "$edition/source.zip"
            )
          done
      - name: Publish the selected editions after their files are uploaded and verified
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PLAN: ${{ needs.resolve.outputs.plan }}
        run: python3 scripts/publish-release.py "$RUNNER_TEMP/meki-delivery"
