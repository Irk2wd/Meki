# The admin origin is separate from the origin that serves publisher-controlled files.
Define MEKIR_MANAGED_GROUPS
LoadModule authz_groupfile_module /usr/lib/apache2/modules/mod_authz_groupfile.so
LoadModule cgid_module /usr/lib/apache2/modules/mod_cgid.so
LoadModule env_module /usr/lib/apache2/modules/mod_env.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
ScriptSock /run/mekir-preview/admin-cgi
Listen 127.0.0.1:17842
<VirtualHost 127.0.0.1:17842>
    ServerName "${MEKIR_ADMIN_ORIGIN}"
    DocumentRoot "/etc/mekir-preview/admin-ui"
    AliasMatch "^/$" "/etc/mekir-preview/admin-ui/index.html"
    ScriptAliasMatch "^/api$" "/etc/mekir-preview/admin-api/registry.cgi"
    <Directory "/etc/mekir-preview/admin-ui">
        Options None
        AllowOverride None
        <Files "index.html">
            ForceType "text/html; charset=utf-8"
        </Files>
        <Files "admin.js">
            ForceType text/javascript
        </Files>
        <Files "admin.css">
            ForceType text/css
        </Files>
    </Directory>
    <Location "/">
        AuthType Basic
        AuthName "mekiR subscription administration"
        AuthUserFile "/etc/mekir-preview/admin-users"
        AuthzSendForbiddenOnFailure On
        <RequireAll>
            Require valid-user
            Require method GET POST
        </RequireAll>
    </Location>
    LimitRequestBody 131072
    SetEnv MEKIR_ADMIN_ORIGIN "${MEKIR_ADMIN_ORIGIN}"
    SetEnv MEKIR_PROJECT_ORIGIN "${MEKIR_PREVIEW_ORIGIN}"
    SetEnv PYTHONDONTWRITEBYTECODE 1
    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"
</VirtualHost>
