# Debian/Ubuntu apache2-bin, behind a TLS reverse proxy.
# Set MEKIR_PREVIEW_ORIGIN to the external scheme, host and port.
ServerRoot /etc/mekir-preview
ServerName "${MEKIR_PREVIEW_ORIGIN}"
Listen 127.0.0.1:17841
LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authn_core_module /usr/lib/apache2/modules/mod_authn_core.so
LoadModule authn_file_module /usr/lib/apache2/modules/mod_authn_file.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_user_module /usr/lib/apache2/modules/mod_authz_user.so
LoadModule auth_basic_module /usr/lib/apache2/modules/mod_auth_basic.so
LoadModule dav_module /usr/lib/apache2/modules/mod_dav.so
LoadModule dav_fs_module /usr/lib/apache2/modules/mod_dav_fs.so
PidFile /run/mekir-preview/httpd.pid
DefaultRuntimeDir /run/mekir-preview
DavLockDB /run/mekir-preview/dav-lock
ErrorLog syslog:local6
LogLevel warn
ServerTokens Prod
ServerSignature Off
StartServers 1
ServerLimit 1
ThreadsPerChild 8
MaxRequestWorkers 8
MinSpareThreads 1
MaxSpareThreads 8
Timeout 45
KeepAliveTimeout 3
DocumentRoot /srv/mekir-previews
<Directory />
    Require all denied
</Directory>
<Directory /srv/mekir-previews>
    Options None
    AllowOverride None
    Dav On
    AuthType Basic
    AuthName "mekiR private previews"
    AuthBasicProvider file
    AuthUserFile /etc/mekir-preview/users
    LimitRequestBody 8388608
    <Limit GET HEAD OPTIONS PROPFIND>
        Require valid-user
    </Limit>
    <LimitExcept GET HEAD OPTIONS PROPFIND>
        Require user publisher
    </LimitExcept>
</Directory>
TraceEnable Off
