# Read the active registry for each request. Project payloads stay under the WebDAV document root.
Alias "/_mekir/accounts/" "/var/lib/mekir-preview-admin/current/catalogs/"
<Directory "/var/lib/mekir-preview-admin">
    Options FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>
<LocationMatch "^/_mekir/accounts/(?<ACCOUNT>[a-zA-Z0-9][a-zA-Z0-9._@-]{0,127})\.json$">
    AuthType Basic
    AuthName "mekiR subscriptions"
    AuthUserFile "/var/lib/mekir-preview-admin/current/users"
    AuthzSendForbiddenOnFailure On
    <RequireAll>
        Require method GET
        Require user "%{env:MATCH_ACCOUNT}"
    </RequireAll>
</LocationMatch>
<DirectoryMatch "^/srv/mekir-previews/(?<PROJECT>[a-zA-Z0-9][a-zA-Z0-9_-]{0,95})(?:/|$)">
    Dav On
    AuthType Basic
    AuthName "mekiR private previews"
    AuthUserFile "/var/lib/mekir-preview-admin/current/users"
    AuthGroupFile "/var/lib/mekir-preview-admin/current/permissions"
    AuthzSendForbiddenOnFailure On
    <Limit GET OPTIONS PROPFIND>
        Require group "read-%{env:MATCH_PROJECT}"
    </Limit>
    <LimitExcept GET OPTIONS PROPFIND>
        Require group "write-%{env:MATCH_PROJECT}"
    </LimitExcept>
</DirectoryMatch>
